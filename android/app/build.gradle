plugins { id 'com.android.application' }

android {
    namespace 'com.example.ytmplayer'
    compileSdk 33
    defaultConfig {
        applicationId "com.example.ytmplayer"
        minSdk 19
        targetSdk 33
        versionCode 15
        versionName "2.4"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'   // 2.18.x = versi terakhir yang mendukung API 19
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'                  // 3.12.x = mendukung API 19
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
}
