name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/33.0.2/aapt2 dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-player-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
