name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner GitHub sudah punya Android SDK; 'android-actions/setup-android'
      # gagal karena paket 'tools' sudah dihapus dari repo SDK.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKM/sdkmanager" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build unsigned APK
        working-directory: android
        # Tanpa signingConfig, AGP menghasilkan app-release-unsigned.apk.
        # Sengapa BUKAN assembleDebug: build debug memakai ~/.android/debug.keystore
        # yang dibuat acak di setiap runner, jadi setiap build punya tanda tangan
        # berbeda dan pemasangan di atas versi lama selalu gagal.
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK with the release keystore
        env:
          KS: ${{ runner.temp }}/ytm-release.jks
        run: |
          set -e
          # Keystore & sandi datang dari rahasia repo, tidak pernah masuk kode.
          printf '%s' "${{ secrets.YTM_KEYSTORE_BASE64 }}" | base64 -d > "$KS"
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIGNED="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/33.0.2/zipalign" -p -f 4 "$APK_UNSIGNED" "$APK_SIGNED"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "${{ secrets.YTM_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.YTM_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.YTM_KEY_PASSWORD }}" \
            --min-sdk-version 19 --max-sdk-version 33 \
            "$APK_SIGNED"
          rm -f "$KS"

      - name: Verify signature scheme
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --min-sdk-version 19 --max-sdk-version 33 --print-certs "$APK" | head -8
          # Sidik jari sertifikat harus SAMA di setiap build; kalau berubah, tanda
          # tangan tidak lagi stabil dan pemasangan di atas versi lama akan gagal lagi.
          echo "CERT_SHA256=$("$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --print-certs "$APK" | grep -o 'SHA-256 digest:.*' | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/33.0.2/aapt2" dump badging android/app/build/outputs/apk/release/app-release.apk | head -6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-player-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
