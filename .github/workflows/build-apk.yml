name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner GitHub sudah punya Android SDK; 'android-actions/setup-android'
      # gagal karena paket 'tools' sudah dihapus dari repo SDK.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKM/sdkmanager" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/33.0.2/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-player-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
